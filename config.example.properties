# Copy this file to config.properties (gitignored) and fill in your own
# values. Every key is optional: an absent file, or an absent key, falls back
# to a harmless default and the app still builds and runs.

# Shared secret for the exported update-trigger broadcast receiver. Anything
# that wants to poke TriggerUpdateReceiver (e.g. a script on your bridge that
# just finished building a new APK) needs to send this same value. Change it
# from the placeholder before you rely on it for anything.
trigger.token=CHANGE-ME-trigger-token

# Initial value for the "bridge URL" field in Settings, before you've ever
# saved one from the app. Leave blank to configure it entirely at runtime.
default.bridge.url=

# Release signing. If signing.storeFile is blank or unset, release builds
# fall back to signing with your debug keystore (~/.android/debug.keystore),
# which is fine for your own sideloading but not for distributing the APK.
signing.storeFile=
signing.storePassword=
signing.keyAlias=
signing.keyPassword=
