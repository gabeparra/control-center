<svg width="1600" height="480" viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="55%" stop-color="#101B32"/>
      <stop offset="100%" stop-color="#151F3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38D9C9" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#38D9C9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38D9C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2B84B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F2B84B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4F8FC"/>
      <stop offset="100%" stop-color="#CBE9E4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#bg)"/>

  <!-- faint texture: diagonal hairlines -->
  <g stroke="#3E6E7C" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="60" x2="1600" y2="-140"/>
    <line x1="0" y1="160" x2="1600" y2="-40"/>
    <line x1="0" y1="620" x2="1600" y2="420"/>
    <line x1="0" y1="520" x2="1600" y2="320"/>
  </g>

  <!-- faint dot grid texture -->
  <g fill="#8FD9CE" fill-opacity="0.14">
    <circle cx="120" cy="80" r="1.6"/>
    <circle cx="170" cy="110" r="1.6"/>
    <circle cx="120" cy="140" r="1.6"/>
    <circle cx="1460" cy="380" r="1.6"/>
    <circle cx="1510" cy="410" r="1.6"/>
    <circle cx="1460" cy="440" r="1.6"/>
    <circle cx="1510" cy="350" r="1.6"/>
  </g>

  <circle cx="1220" cy="120" r="360" fill="url(#glow)"/>
  <circle cx="360" cy="420" r="300" fill="url(#glow2)"/>

  <!-- emblem: a control-node mark, upper-left of the wordmark -->
  <g transform="translate(140,170)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="none" stroke="#3ED6C4" stroke-width="3" stroke-opacity="0.85"/>
    <circle cx="46" cy="46" r="9" fill="#3ED6C4"/>
    <circle cx="46" cy="18" r="4.5" fill="#CBE9E4" fill-opacity="0.9"/>
    <circle cx="46" cy="74" r="4.5" fill="#CBE9E4" fill-opacity="0.9"/>
    <circle cx="18" cy="46" r="4.5" fill="#CBE9E4" fill-opacity="0.9"/>
    <circle cx="74" cy="46" r="4.5" fill="#CBE9E4" fill-opacity="0.9"/>
    <line x1="46" y1="46" x2="46" y2="22" stroke="#3ED6C4" stroke-width="2.4" stroke-opacity="0.8"/>
    <line x1="46" y1="46" x2="46" y2="70" stroke="#3ED6C4" stroke-width="2.4" stroke-opacity="0.8"/>
    <line x1="46" y1="46" x2="22" y2="46" stroke="#3ED6C4" stroke-width="2.4" stroke-opacity="0.8"/>
    <line x1="46" y1="46" x2="70" y2="46" stroke="#3ED6C4" stroke-width="2.4" stroke-opacity="0.8"/>
  </g>

  <text x="264" y="228" font-family="Montserrat, sans-serif" font-weight="700" font-size="82" fill="url(#wordmark)" letter-spacing="1">Control Center</text>

  <text x="266" y="272" font-family="Montserrat, sans-serif" font-weight="500" font-size="24" fill="#7FA8A3" letter-spacing="4">RUN YOUR HOMELAB FROM YOUR POCKET</text>

  <!-- baseline rule -->
  <line x1="140" y1="320" x2="1460" y2="320" stroke="#2C4A52" stroke-width="1" stroke-opacity="0.6"/>
  <text x="140" y="352" font-family="Montserrat, sans-serif" font-weight="500" font-size="18" fill="#5E848A" letter-spacing="2">SYSTEMD · DOCKER · TMUX · DNS · WAKE-ON-LAN · MEDIA</text>
</svg>
